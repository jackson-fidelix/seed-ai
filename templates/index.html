<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seed AI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="{% load static %}{% static 'css/style.css' %}">
</head>
<body class="light">
        <div class="conteiner py-4">
            <div class="text-center mb-4">
                <h1 class="display-5 fw-bold" style="color: #4a7c59;">Seed AI</h1>
                <p class="fs-4" id="">Analisador de sentimentos</p>
                <button id="theme-toggle" class="btn btn-sm btn-outline-secondary rounded-pill px-3">
                    <i class="bi bi-moon-stars-fill"></i> Modo Escuro
                </button>
            </div>

            <div class="card chat-card">
                <div class="card-body p-0">
                    <div id="chat" class="chat-container d-flex flex-column gap-3">
                        <div class="text-center text-muted py-5">
                            <i class="bi bi-flower1 display-4 mb-3" style="color: #5d9c6e;"></i>
                            <p class="fs-5">Olá! Eu sou o Seed AI.<br>Pode falar comigo como se fosse um amigo da igreja.</p>
                        </div>
                    </div>

                    <div class="p-3 input-area border-top">
                        <div class="input-group">
                            <input type="text" id="msg" class="form-control form-control-lg border-0 shadow-sm" 
                                placeholder="Como tá seu coração hoje?">
                            <button id="send" class="btn btn-primary btn-lg px-4" style="background-color: #4a7c59; border: none;">
                                <i class="bi bi-send-fill"></i>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        
        <button id="camera-btn" class="camera-btn btn text-white" title="Em breve: tire uma foto e receba uma palavra">
            <i class="bi bi-camera-fill" style="font-size: 24px;"></i>
        </button>

        <script src="{% load static %}{% static 'js/script.js' %}"></script>
</body>
</html>
