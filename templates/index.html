{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seed AI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body class="light">
        <div class="container py-4">
            <div class="text-center mb-4">
                <h1 class="display-5 fw-bold" style="color: #4a7c59;">Seed AI</h1>
                <p class="fs-4" id="">Estudo Bíblico e Análise de sentimentos</p>
                <button id="theme-toggle" class="btn btn-sm btn-outline-secondary rounded-pill px-3">
                    <i class="bi bi-moon-stars-fill"></i> Modo Escuro
                </button>
            </div>

            <div class="card chat-card">
                <div class="card-body p-0">
                    <div id="chat" class="chat-container d-flex flex-column gap-3">
                        <div class="text-center text-muted py-5">
                            <i class="bi bi-flower1 display-4 mb-3" style="color: #5d9c6e;"></i>
                            <p class="fs-5">Olá! Eu sou o Seed AI.<br>Pode falar comigo como se fosse um amigo da igreja.</p>
                        </div>
                    </div>
                        <div class="attach-floating">
                            <button class="attach-btn" id="open-camera" type="button">
                                <i class="bi bi-camera"></i>
                            </button>

                            <button class="attach-btn" id="open-file" type="button">
                                <i class="bi bi-paperclip"></i>
                            </button>

                            <input type="file" id="camera-input" accept="image/*" capture="environment" hidden>
                            <input type="file" id="file-input" hidden>
                        </div>

                        <div class="p-3 input-area" style="border: none;">
                            <div class="position-relative">
                                <input type="text" id="msg" class="form-control form-control-lg border-0 shadow-sm pe-5" 
                                    placeholder="Como tá seu coração hoje?" style="box-shadow: #4a7c59;" autocomplete="off">
                                
                                <button id="send" class="btn btn-primary position-absolute top-50 end-0 translate-middle-y me-2 px-4 py-2" 
                                        style="background-color: #4a7c59; border: none; border-radius: 10px;">
                                    <i class="bi bi-send-fill"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>     

        <script src="{% static 'js/script.js' %}"></script>
</body>
</html>
